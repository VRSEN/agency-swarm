[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project]
name = "agency-swarm"
version = "2.0.0-beta.1"
description = "Agency Swarm framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Vrsen AI Solutions", email = "me@vrsen.ai" }]
dependencies = [
    "openai>=3,<4",
    # Exact pin: Agency Swarm relies on private/internal SDK seams that must be
    # re-verified before bumping this pin:
    # - agents.models.openai_provider.shared_http_client
    # - agents.voice.models.openai_model_provider.shared_http_client
    # - RunContextWrapper._copy_for_run_state
    # - agents._debug.DONT_LOG_TOOL_DATA
    # - agents.run_config._coerce_run_config
    # - Session._ignore_ids_for_matching (agents.run_internal.session_persistence)
    # - agents.memory.openai_responses_compaction_session._normalize_compaction_output_items
    # - agents.memory.openai_responses_compaction_session._strip_orphaned_assistant_ids
    # - agents.tracing.setup.GLOBAL_TRACE_PROVIDER
    # - agents.models._openai_shared.get_default_openai_client
    # - MCPServerManager._run_connect
    # - OpenAIResponsesModel._fetch_response / _client
    # - OpenAIChatCompletionsModel._fetch_response / _get_client / _client
    # - OpenAIProvider._client / _stored_base_url
    # - MultiProvider._openai_prefix_mode / _unknown_prefix_mode
    # - RunState._context / _starting_agent / _current_agent / _conversation_id /
    #   _previous_response_id / _auto_previous_response_id
    # - Handoff._agent_ref
    # - FunctionTool._tool_namespace / _is_agent_tool / _is_codex_tool / _agent_instance /
    #   on_invoke_tool (_function_tool, _invoke_tool_impl, __agents_bind_function_tool__)
    # - OpenAIRealtimeWebSocketModel._handle_ws_event / _send_raw_message / _websocket /
    #   _audio_state_tracker / _playback_tracker
    # - ChatCmplStreamHandler.handle_stream
    "openai-agents==0.26.0",
    "datamodel-code-generator>=0.56.0,<0.84.0",
    "docstring-parser>=0.16,<1.0.0",
    "fastmcp>=4.0.5,<5",
    "jsonref>=1.1.0,<2.0.0",
    "mcp>=2,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1.1,<2.0.0",
    "rich>=13.9.4,<16.0.0",
    "prompt-toolkit>=3.0.0,<4.0.0",
    "typing-extensions>=4.13,<5",
    "watchfiles>=1.0.0,<2.0.0",
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.35.0",
    "ag-ui-protocol>=0.1.18,<1",
    "aiofiles>=23.2.1",
    "filetype>=1.2.0",
    "httpx2>=2.13,<3",
]
classifiers = [
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/VRSEN/agency-swarm"
Repository = "https://github.com/VRSEN/agency-swarm"

[project.scripts]
agency-swarm = "agency_swarm.cli.main:main"

[project.optional-dependencies]
voice = ["numpy>=2.2.0, <3; python_version>='3.10'", "websockets>=15.0,<17"]
viz = ["graphviz>=0.17"]
litellm = ["litellm>=1.108.0"]
jupyter = ["ipykernel>=6.29.0,<8.0.0", "jupyter_client>=8.0.0,<9.0.0", "nest_asyncio>=1.6.0,<2.0.0"]

fastapi = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.35.0",
    "ag-ui-protocol>=0.1.18,<1",
    "aiofiles>=23.2.1",
    "filetype>=1.2.0",
    "httpx2>=2.13,<3",
]

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "mypy>=2.3.1",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.1",
    "ruff>=0.16.8",
    "langchain-core>=1.6.3",
    "langchain-experimental>=0.0.50",
    "langchain-community>=0.0.20",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "ag-ui-protocol>=0.1.18,<1",
    "aiofiles>=23.2.1",
    "filetype>=1.2.0",
    "httpx2>=2.13,<3",
    "ipykernel>=6.29.0,<8.0.0",
    "jupyter_client>=8.0.0,<9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agency_swarm"]
exclude = ["**/node_modules/**", "**/.next/**"]
artifacts = [
    # Copilot frontend files
    "ui/demos/copilot/**/*.ts",
    "ui/demos/copilot/**/*.tsx",
    "ui/demos/copilot/**/*.css",
    "ui/demos/copilot/**/*.json",
    "ui/demos/copilot/**/*.mjs",
    "ui/demos/copilot/**/*.ico",
    "ui/demos/copilot/**/*.svg",
    # Pricing data file
    "data/model_prices_and_context_window.json",
]

[tool.hatch.build.targets.wheel.force-include]
"src/agency_swarm/cli/utils/generate-agent-from-settings.ts" = "agency_swarm/cli/utils/generate-agent-from-settings.ts"

[tool.hatch.build.targets.sdist]
include = [
    "src/agency_swarm/**/*.py",
    "src/agency_swarm/**/*.ts",
    "src/agency_swarm/ui/templates/**",
    "src/agency_swarm/ui/demos/copilot/**",
    "src/agency_swarm/data/model_prices_and_context_window.json",
]
exclude = ["**/node_modules/**", "**/.next/**"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    "docs/**",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
isort = { combine-as-imports = true, known-first-party = ["agency_swarm"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E501"]

[tool.mypy]
# Relax strictness to get CI green without functional changes.
strict = false
ignore_missing_imports = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_no_return = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "sounddevice.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ag_ui.*",
    "filetype",
    "jsonref",
    "aiofiles",
    "langchain_community.*",
    "fastmcp.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["tests", "src/agency_swarm"]

[tool.coverage.report]
show_missing = true
sort = "-Cover"
exclude_also = [
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
    "raise NotImplementedError",
    "logger.debug",
]

[tool.pytest.ini_options]
markers = [
    "asyncio: mark test as asyncio",
    "allow_call_model_methods: mark test as allowing calls to real model implementations",
    "fastapi: mark test as requiring FastAPI dependencies",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "ignore:coroutine 'test_async_input_filter_fails.<locals>.invalid_input_filter' was never awaited:RuntimeWarning",
]

testpaths = ["tests"]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"
